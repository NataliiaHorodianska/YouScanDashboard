services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The API migrates the database on startup, so it must not start before Postgres accepts connections.
      test: ['CMD-SHELL', 'pg_isready -U dashboard -d dashboard']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: YouScanDashboard.Server/Dockerfile
    environment:
      # Overrides ConnectionStrings:Dashboard from appsettings.json.
      ConnectionStrings__Dashboard: 'Host=db;Port=5432;Database=dashboard;Username=dashboard;Password=dashboard'
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
